name: Test ban fail2ban (temporaire)
on: workflow_dispatch
jobs:
  ban:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "IP du runner : $(curl -s https://api.ipify.org)"
          for i in 1 2 3 4 5 6 7; do curl -s -o /dev/null -w "essai $i : %{http_code}\n" -u "intrus:mauvais$i" https://preview.bencat.dev/; sleep 1; done
          sleep 20
          echo "après ban, preview : $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://preview.bencat.dev/ || true)"
          echo "après ban, bzc     : $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://bzc.bencat.dev/health || true)"
